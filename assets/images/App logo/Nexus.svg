<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B6BFB" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Line Drawing Animations */
      @keyframes drawLeft {
        to { stroke-dashoffset: 0; }
      }
      @keyframes drawDiag {
        to { stroke-dashoffset: 0; }
      }
      @keyframes drawRight {
        to { stroke-dashoffset: 0; }
      }
      
      /* Node Pulsing */
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; }
      }

      /* Text Fade & Slide */
      @keyframes textReveal {
        0% { opacity: 0; transform: translateY(15px); letter-spacing: 4px; }
        100% { opacity: 1; transform: translateY(0); letter-spacing: 12px; }
      }
      
      /* Orb Floating */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      .line-1 {
        stroke-dasharray: 160;
        stroke-dashoffset: 160;
        animation: drawLeft 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .line-2 {
        stroke-dasharray: 240;
        stroke-dashoffset: 240;
        animation: drawDiag 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
      }
      .line-3 {
        stroke-dasharray: 160;
        stroke-dashoffset: 160;
        animation: drawRight 0.8s cubic-bezier(0.4, 0, 0.2, 1) 1s forwards;
      }

      .node-1 { transform-origin: 120px 240px; animation: pulse 3s ease-in-out infinite; }
      .node-2 { transform-origin: 120px 120px; animation: pulse 3s ease-in-out 1s infinite; }
      .node-3 { transform-origin: 280px 240px; animation: pulse 3s ease-in-out 1.5s infinite; }
      .node-4 { transform-origin: 280px 120px; animation: pulse 3s ease-in-out 0.5s infinite; }

      .brand-text {
        opacity: 0;
        animation: textReveal 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 1.5s forwards;
      }
      
      .floating-orb-1 { animation: float 4s ease-in-out infinite; }
      .floating-orb-2 { animation: float 5s ease-in-out 1s infinite; }
      .floating-orb-3 { animation: float 6s ease-in-out 2s infinite; }
    </style>
  </defs>

  <rect width="100%" height="100%" rx="32" fill="#0F172A" />

  <g filter="url(#glow)" opacity="0.15">
    <circle class="floating-orb-1" cx="80" cy="80" r="30" fill="#2DD4BF" />
    <circle class="floating-orb-2" cx="320" cy="280" r="40" fill="#A78BFA" />
    <circle class="floating-orb-3" cx="300" cy="90" r="25" fill="#34D399" />
  </g>

  <g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="20" filter="url(#glow)">
    <path class="line-1" d="M120 240 L120 120" stroke="url(#tealGrad)" />
    
    <path class="line-2" d="M120 120 L280 240" stroke="url(#blueGrad)" />
    
    <path class="line-3" d="M280 240 L280 120" stroke="url(#purpleGrad)" />
  </g>

  <g fill="#1E293B" stroke-width="4">
    <circle class="node-1" cx="120" cy="240" r="12" stroke="#2DD4BF" />
    <circle class="node-2" cx="120" cy="120" r="12" stroke="#4B6BFB" />
    <circle class="node-3" cx="280" cy="240" r="12" stroke="#6366F1" />
    <circle class="node-4" cx="280" cy="120" r="12" stroke="#A78BFA" />
  </g>

  <text class="brand-text" 
        x="200" y="330" 
        fill="#F8FAFC" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        text-anchor="middle">
    NEXUS
  </text>
  
  <text class="brand-text" 
        x="200" y="355" 
        fill="#94A3B8" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="12" 
        font-weight="500" 
        letter-spacing="4"
        text-anchor="middle"
        style="animation-delay: 1.8s;">
    FINANCE & LIFE
  </text>
</svg>