name: nexus
description: "Nexus - Personal Finance Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.6

  # Notifications
  flutter_local_notifications: ^17.2.1

  # State Management
  provider: ^6.1.2

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  animations: ^2.0.11
  flutter_slidable: ^3.1.1

  # Storage & Preferences
  shared_preferences: ^2.3.2
  flutter_secure_storage: 9.2.4

  # Biometric Authentication
  local_auth: ^2.3.0

  # Charts & Analytics
  fl_chart: ^0.69.0
  syncfusion_flutter_charts: ^26.2.8

  # Date & Time
  intl: ^0.19.0

  # Another Telephony
  another_telephony: ^0.4.1

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  flutter_sms_inbox: ^1.0.4
  file_picker: ^10.3.8
  pdf: ^3.10.8
  
  # Location & Geolocation
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http: ^1.6.0

  # Icons
  cupertino_icons: ^1.0.8
  
  # Google APIs
  google_sign_in: ^6.2.1
  googleapis: ^15.0.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  flutter_dotenv: ^6.0.0

  # Android Auto - Package not available on pub.dev
  # car_app: ^0.6.0 # Commented out - not available
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/Nexus_padded.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/Nexus_padded.png"
  min_sdk_android: 21
  # Add padding to prevent cropping
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Asset declaration to include the font directories
  assets:
    # Environment file for flutter_dotenv (required for dotenv.load)
    - .env
    - assets/fonts/Rammetto_One/
    - assets/fonts/Inter/static/
    - assets/icons/
    - assets/images/

  fonts:
    - family: RammettoOne
      fonts:
        - asset: assets/fonts/Rammetto_One/RammettoOne-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/static/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/static/Inter_18pt-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#0F172A"
  image: assets/icons/Nexus.png
  android: true
  ios: true
  web: false
  # Add padding to prevent logo from being cropped
  fullscreen: true
  android_12:
    image: assets/icons/Nexus.png
    color: "#0F172A"
