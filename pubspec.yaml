name: nexus
description: "Nexus"
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_analytics: ^12.4.2
  firebase_messaging: ^16.3.0
  firebase_crashlytics: ^5.2.3
  firebase_storage: ^13.4.2

  # Notifications
  flutter_local_notifications: ^22.0.0

  # State Management
  provider: ^6.1.2
  
  # Navigation
  go_router: ^17.3.0

  # UI & Design
  google_fonts: ^8.1.0
  flutter_svg: ^2.1.0
  lottie: ^3.1.2
  animations: ^2.0.11
  flutter_slidable: ^4.0.3

  # Storage & Preferences
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.1

  # Biometric Authentication
  local_auth: ^3.0.1

  # Charts & Analytics
  fl_chart: ^1.2.0
  syncfusion_flutter_charts: ^33.2.10

  # Date & Time
  intl: ^0.20.2

  # Another Telephony
  another_telephony: ^0.4.1

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.3
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  url_launcher: ^6.3.0
  flutter_sms_inbox: ^1.0.4
  pdf: ^3.10.8
  path_provider: ^2.1.2
  share_plus: ^12.0.2
  flutter_markdown_plus: ^1.0.7
  google_generative_ai: ^0.4.0
  file_picker: ^11.0.2
  
  # Location & Geolocation
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http: ^1.6.0

  # Icons
  cupertino_icons: ^1.0.8
  
  # NFC
  nfc_manager: ^4.1.1
  
  # Google APIs
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.1
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  flutter_dotenv: ^6.0.0
  syncfusion_flutter_pdf: ^33.2.10
  # FIX: Removed ota_update — not used, conflicts with custom OTA service

  # App Info
  package_info_plus: ^8.2.0

  # Dio
  dio: ^5.4.0
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "assets/icons/icon_background.png"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/fonts/Rammetto_One/
    - assets/fonts/Inter/static/
    - assets/icons/
    - assets/images/
    - assets/images/banks/
    - assets/images/Subscriptions/
    - assets/images/Garage/
    - assets/images/App logo/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf

    - family: RammettoOne
      fonts:
        - asset: assets/fonts/Rammetto_One/RammettoOne-Regular.ttf

flutter_native_splash:
  color: "#0F172A"
  image: "assets/icons/icon.png"
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    image: "assets/icons/icon.png"
    color: "#0F172A"