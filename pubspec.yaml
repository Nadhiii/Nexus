name: nexus
description: "Nexus - Personal Finance Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_analytics: ^11.3.3

  # State Management
  provider: ^6.1.2

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  dynamic_color: ^1.7.0
  animations: ^2.0.11

  # Storage & Preferences
  shared_preferences: ^2.3.2
  flutter_secure_storage: 9.2.4

  # Biometric Authentication
  local_auth: ^2.3.0

  # Charts & Analytics
  fl_chart: ^0.69.0
  syncfusion_flutter_charts: ^26.2.8

  # Date & Time
  intl: ^0.19.0

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_sms_inbox: ^1.0.4
  url_launcher: ^6.3.0

  # Icons
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Asset declaration to include the font directories
  assets:
    - assets/fonts/Rammetto_One/
    - assets/fonts/Inter/static/

  fonts:
    - family: RammettoOne
      fonts:
        - asset: assets/fonts/Rammetto_One/RammettoOne-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/static/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/static/Inter_18pt-Bold.ttf
          weight: 700
